name: HelioForge CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest flake8

      - name: Lint (Critical Errors)
        run: |
          flake8 . \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics

      - name: Lint (Style Report)
        run: |
          flake8 . \
          --count \
          --exit-zero \
          --max-complexity=12 \
          --max-line-length=100 \
          --statistics

      - name: Run Unit Tests
        run: |
          pytest -v
