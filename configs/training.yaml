# =============================================================================
# HelioForge-AI — Baseline TCN Training Configuration
# Target: EC2 Ubuntu  (ubuntu@ip-172-31-46-7)
#
# EC2 HARDWARE CONSTRAINTS:
#   RAM  : 8 GB total  (OS + Python ~1.5 GB → ~6.5 GB usable)
#   CPU  : 2 physical cores
#   GPU  : None
#
# Memory budget at default settings (batch=16, 8.4M-param model):
#   Weights + grads + AdamW moments  :  ~132 MB
#   Activations (8 blocks, batch=16) :  ~132 MB
#   Dataset (train + val in RAM)     :  ~150 MB
#   Python / OS overhead             :  ~800 MB
#   ──────────────────────────────────────────
#   Estimated total                  :  ~1.2 GB  (safe within 8 GB)
#
# Gradient accumulation:
#   batch_size=16, accum_steps=2 → effective batch = 32.
#   Matches full-batch training dynamics with half the activation memory.
#
# DataLoader workers:
#   num_workers=0 — each worker process costs ~300–500 MB RAM.
#   On a 2-core CPU, workers add IPC overhead. Single-thread is faster.
#
# All path values here are informational / overrides for train.py.
# The script resolves all defaults from configs/data_paths.yaml via PATH_CFG.
#
# Usage:
#   python scripts/train.py   ← uses PATH_CFG defaults (no args needed)
#
# To override a single value:
#   python scripts/train.py --lr 3e-4 --norm-type layer --run-name ablation_1
# =============================================================================

# ---------------------------------------------------------------------------
# Data  (resolved from data_paths.yaml — shown here for reference)
# ---------------------------------------------------------------------------
data:
  windows_dir : /opt/helioforge-ai/data/windows
  train_file  : train_feat32_w512.pt
  val_file    : val_feat32_w512.pt
  scaler_file : scaler_f32_w512.json

  # Label derivation — performed on-the-fly from scaler + peak flux
  # channel 0 (soft_mean) → reverse MinMax → physical COUNTS/sec
  # Thresholds: [100, 500, 2000, 8000]  →  classes [0=Quiet, 1=B, 2=C, 3=M, 4=X]
  label_source : soft_mean_peak_counts
  soft_channel : 0

# ---------------------------------------------------------------------------
# Output paths  (resolved from data_paths.yaml — shown here for reference)
# ---------------------------------------------------------------------------
output:
  runs_dir        : /opt/helioforge-ai/experiments/baseline_tcn/runs
  checkpoints_dir : /opt/helioforge-ai/experiments/baseline_tcn/checkpoints
  logs_dir        : /opt/helioforge-ai/logs
  training_log    : /opt/helioforge-ai/logs/training.log

# ---------------------------------------------------------------------------
# Optimizer
# ---------------------------------------------------------------------------
optimizer:
  name         : AdamW
  lr           : 1.0e-3
  weight_decay : 1.0e-4

# ---------------------------------------------------------------------------
# Scheduler
# ---------------------------------------------------------------------------
scheduler:
  name    : ReduceLROnPlateau
  mode    : min          # monitor val_loss
  factor  : 0.5          # halve LR on plateau
  patience: 7            # = patience // 2 (see early_stopping.patience)

# ---------------------------------------------------------------------------
# Training loop
# ---------------------------------------------------------------------------
training:
  n_epochs    : 80
  batch_size  : 16         # EC2: 16 to halve activation memory (vs 32)
  accum_steps : 2          # gradient accumulation → effective batch = 32
  grad_clip   : 1.0        # max grad norm (prevents explosion on deep TCN)
  label_smooth: 0.0        # label smoothing epsilon (0 = off)
  seed        : 42
  num_workers : 0          # EC2: 0 worker processes (2-core CPU, 8 GB RAM)
  num_threads : 2          # torch.set_num_threads — match physical cores
  pin_memory  : false      # EC2: always false — no GPU, wastes RAM

# ---------------------------------------------------------------------------
# Early stopping
# ---------------------------------------------------------------------------
early_stopping:
  patience : 15           # epochs without val_loss improvement before stop
  monitor  : val_loss

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
checkpointing:
  save_best_val_loss : true    # saved as best_val_loss.pt
  save_best_macro_f1 : true    # saved as best_macro_f1.pt   ← primary model
  save_final         : true    # saved as final.pt (last epoch)
  primary_metric     : macro_f1

# ---------------------------------------------------------------------------
# Class weighting (computed automatically from train split label distribution)
# ---------------------------------------------------------------------------
# Formula:  w_c = N_total / (n_classes * N_c)
# Do NOT hardcode weights here — they are computed at runtime from actual
# label counts via build_weighted_criterion() in losses.py.
loss:
  name             : CrossEntropyLoss
  class_weighted   : true
  weight_formula   : "N_total / (n_classes * N_c)"
