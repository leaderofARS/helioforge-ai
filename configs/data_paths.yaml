# =============================================================================
# HelioForge-AI — Dataset & Deployment Path Configuration
# Target:  EC2 Ubuntu instance  (ubuntu@ip-172-31-46-7)
# Project: SOLAR PRELUDE  |  Architecture: HPINA / Baseline TCN
#
# Dataset: 55 GB  —  /opt/helioforge-ai/data/raw/
#   hel1os/  →  batch folders (hel1os_2026Jun26T*/HLS_*/...)
#   solexs/  →  observation folders (SDD2/*.lc, *.gti, *.pi)
#
# All paths are absolute so the pipeline works regardless of the
# working directory from which scripts are invoked on the EC2 instance.
#
# Usage (Python):
#   from src.HPINA.configs.paths import PathConfig
#   cfg = PathConfig.from_yaml("configs/data_paths.yaml")
# =============================================================================

# ---------------------------------------------------------------------------
# Root — change only this line when deploying to a different machine
# ---------------------------------------------------------------------------
dataset_root: /opt/helioforge-ai

# ---------------------------------------------------------------------------
# Dataset budget  —  55 GB subset of the full 83.1 GB raw archive
#
# Full dataset breakdown:
#   HEL1OS : 48.9 GB  (58.85% of total)
#   SoLEXS : 34.2 GB  (41.15% of total)
#   TOTAL  : 83.1 GB
#
# 55 GB target — same 58.85 / 41.15 instrument ratio:
#   HEL1OS budget : 48.9 × (55/83.1) = 32.4 GB
#   SoLEXS budget : 34.2 × (55/83.1) = 22.6 GB
#
# mode:
#   "all"      — process every observation (full 83.1 GB)
#   "budget"   — accumulate observations (sorted by name, reproducible)
#                until hel1os_gb / solexs_gb byte ceilings are reached
# ---------------------------------------------------------------------------
dataset:
  mode:        budget        # "all" | "budget"
  total_gb:    55.0          # informational only
  hel1os_gb:   32.4          # 48.9 × (55 / 83.1)
  solexs_gb:   22.6          # 34.2 × (55 / 83.1)
  sort_key:    name          # sort observations by folder name (reproducible)

# ---------------------------------------------------------------------------
# Stage 1 – Raw Observations  (55 GB — READ ONLY, never modified)
# ---------------------------------------------------------------------------
raw:
  root:   /opt/helioforge-ai/data/raw
  solexs: /opt/helioforge-ai/data/raw/solexs       # SoLEXS soft X-ray FITS files
  hel1os: /opt/helioforge-ai/data/raw/hel1os       # HEL1OS hard X-ray FITS files
                                                    # Batch folders: hel1os_2026Jun26T*/
                                                    # Observations:  HLS_*_lev1_V{111,211}/

# ---------------------------------------------------------------------------
# Stage 2 – Preprocessing outputs
# Produced by src/pipeline/preprocessing/  |  scripts/preprocess.py
# ---------------------------------------------------------------------------
preprocessing:
  validated:    /opt/helioforge-ai/data/preprocessing/validated       # Post-GTI-filter
  synchronized: /opt/helioforge-ai/data/preprocessing/synchronized    # SoLEXS–HEL1OS aligned
  processed:    /opt/helioforge-ai/data/preprocessing/processed       # Calibrated time series

# ---------------------------------------------------------------------------
# Stage 3 – Feature Engineering (118 physics-informed features)
# Produced by src/features/  |  scripts/features.py
# ---------------------------------------------------------------------------
features:
  root:     /opt/helioforge-ai/data/features
  csv:      /opt/helioforge-ai/data/features/selected_features.csv
  parquet:  /opt/helioforge-ai/data/features/selected_features.parquet
  excel:    /opt/helioforge-ai/data/features/selected_features.xlsx

# ---------------------------------------------------------------------------
# Stage 4 – Windowed Datasets
# Sliding-window tensors ready for the TCN DataLoader.
# Produced by src/HPINA/data/datasets.py
# ---------------------------------------------------------------------------
windows:
  root:  /opt/helioforge-ai/data/windows
  train: /opt/helioforge-ai/data/windows/train.pt
  val:   /opt/helioforge-ai/data/windows/val.pt
  test:  /opt/helioforge-ai/data/windows/test.pt

# ---------------------------------------------------------------------------
# Metadata
# Observatory-level metadata, sync reports, GTI tables.
# ---------------------------------------------------------------------------
metadata:
  root:              /opt/helioforge-ai/data/metadata
  solexs_metadata:   /opt/helioforge-ai/data/metadata/solexs_metadata.csv
  hel1os_metadata:   /opt/helioforge-ai/data/metadata/hel1os_metadata.csv
  sync_report:       /opt/helioforge-ai/data/metadata/synchronization_report.csv
  gti_table:         /opt/helioforge-ai/data/metadata/gti_table.csv

# ---------------------------------------------------------------------------
# Stage 5 – Model Artefacts
# Saved weights, ONNX exports, traced models.
# Organised by HPINA version to support the V1→V7 evolution roadmap.
# ---------------------------------------------------------------------------
models:
  root:         /opt/helioforge-ai/models
  baseline_tcn: /opt/helioforge-ai/models/baseline_tcn      # V1 – this blueprint
  multiscale:   /opt/helioforge-ai/models/multiscale_tcn    # V2 (future)
  dual_stream:  /opt/helioforge-ai/models/dual_stream_tcn   # V3 (future)
  full_hpina:   /opt/helioforge-ai/models/full_hpina        # V7 (future)

# ---------------------------------------------------------------------------
# Experiments — checkpoints, runs, ablations
# Maps to experiments/baseline_tcn/ in the local project tree.
# ---------------------------------------------------------------------------
experiments:
  root:        /opt/helioforge-ai/experiments
  baseline_tcn:
    root:        /opt/helioforge-ai/experiments/baseline_tcn
    runs:        /opt/helioforge-ai/experiments/baseline_tcn/runs          # TensorBoard / WandB
    checkpoints: /opt/helioforge-ai/experiments/baseline_tcn/checkpoints   # .pt weight files
    ablations:   /opt/helioforge-ai/experiments/baseline_tcn/ablations     # Ablation sub-runs

# ---------------------------------------------------------------------------
# Predictions / Inference Outputs
# ---------------------------------------------------------------------------
outputs:
  root:        /opt/helioforge-ai/outputs
  predictions: /opt/helioforge-ai/outputs/predictions    # Raw model outputs (.csv / .npy)
  reports:     /opt/helioforge-ai/outputs/reports        # Evaluation reports

# ---------------------------------------------------------------------------
# Reports & Visualisations
# Generated by visualizations/  and  src/HPINA/evaluation/
# ---------------------------------------------------------------------------
reports:
  root:    /opt/helioforge-ai/reports
  figures: /opt/helioforge-ai/reports/figures       # Heatmaps, PCA plots, distributions
  tables:  /opt/helioforge-ai/reports/tables        # CSV summaries, confusion matrices

# ---------------------------------------------------------------------------
# Logs
# Training logs, pipeline logs, error traces.
# ---------------------------------------------------------------------------
logs:
  root:       /opt/helioforge-ai/logs
  pipeline:   /opt/helioforge-ai/logs/pipeline.log      # Ingestion / preprocessing
  training:   /opt/helioforge-ai/logs/training.log      # Epoch-level training log
  evaluation: /opt/helioforge-ai/logs/evaluation.log    # Metric computation log
  errors:     /opt/helioforge-ai/logs/errors.log        # Exception traces

# ---------------------------------------------------------------------------
# Normalisation statistics
# Computed from the training split; applied unchanged to val/test.
# Stored as JSON to be reloaded at inference time.
# ---------------------------------------------------------------------------
normalisation:
  stats_json: /opt/helioforge-ai/data/features/normalisation_stats.json
